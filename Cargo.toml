[workspace]
members = ["."]
resolver = "3"

[package]
name = "catalyst"
version = "0.1.0"
edition = "2024"
description = "A Rust-backed ORM and SQL toolkit for Python"
license = "MIT"
readme = "README.md"

[lib]
name = "_catalyst"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
rusqlite = { version = "0.39", features = ["bundled"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "core"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
