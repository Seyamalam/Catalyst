services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: catalyst
      POSTGRES_USER: catalyst
      POSTGRES_PASSWORD: catalyst
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalyst -d catalyst"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4.3
    environment:
      MYSQL_DATABASE: catalyst
      MYSQL_USER: catalyst
      MYSQL_PASSWORD: catalyst
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucatalyst", "-pcatalyst"]
      interval: 5s
      timeout: 3s
      retries: 20
