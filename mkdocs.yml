site_name: Catalyst
site_description: Rust-backed ORM and SQL toolkit for Python
site_url: https://example.invalid/catalyst/
repo_name: catalyst

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Development: development.md
  - Benchmarks: benchmarks.md
  - Decisions:
      - Driver selection: decisions/0001-driver-selection.md
      - Documentation tooling: decisions/0002-documentation-tooling.md
      - PostgreSQL driver: decisions/0003-postgresql-driver.md
      - MySQL driver: decisions/0004-mysql-driver.md
  - Parity:
      - Overview: parity/index.md
      - Core: parity/core.md
      - ORM: parity/orm.md
      - Session: parity/session.md
      - Async: parity/async.md
      - Dialects: parity/dialects.md
      - Types: parity/types.md
      - Events: parity/events.md
  - Ground truth:
      - Session write path: session-write-ground-truth.md
      - Relationship loading: relationship-loading-ground-truth.md
      - Many-to-many: many-to-many-ground-truth.md
      - Session merge/expunge/bulk: session-merge-expunge-ground-truth.md
      - Inheritance: inheritance-ground-truth.md
      - M4 tail (dataclass, savepoints, events): m4-tail-ground-truth.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search
  - mermaid2

theme:
  name: material
