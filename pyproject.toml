[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "catalyst-orm"
version = "0.1.0"
description = "A Rust-backed ORM and SQL toolkit for Python"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=5",
    "pytest-cov>=6",
    "hypothesis>=6",
    "mypy>=1.13",
    "pyright>=1.1",
    "ruff>=0.8",
    "sqlalchemy>=2.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-mermaid2-plugin>=1.2",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "asyncmy>=0.2.10",
    "aiosqlite>=0.20",
]

[tool.maturin]
python-source = "python"
module-name = "catalyst._catalyst"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: optional checks against real database services"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "python"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["python/catalyst"]
